name: polymarket-ladder

# Records BTC markets only after /clob-markets confirms itode is absent/false. Daily above,
# price-range, hit and day up/down resolve from Binance BTC/USDT 1m candles; 4-hour up/down is
# kept as a separate Chainlink-TWAP comparison, never treated as deterministic Binance arbitrage. With
# Binance BTCUSDT aggregated trades, for `hours` from ci/ladder.json on a GitHub runner
# (ladder.py record: market data only, never places orders, uses no key), keeps the recording as
# artifacts, dispatches the next run while today <= `until`, then rebuilds every ladder recording
# so far and commits research/polymarket-5m/real/ladder-check.md (ladder_check.py). Set
# "enabled": false in ci/ladder.json to stop the chain sooner; changing ci/ladder.request starts a
# run by hand.
#
# Two jobs keep recording and reporting isolated. A trusted external monitor starts the next
# branch run only after this run succeeds; pushes made with GITHUB_TOKEN cannot recursively
# trigger Actions. Artifacts per run: ladder-<run id> (the built tables and the
# small raw files: markets, errors, Binance trades) and ladder-raw-<run id> (the raw CLOB
# messages, read only if a run's own build failed).
on:
  push:
    branches: [claude/polymarket-options-strategy-1lc7i4]
    paths: [research/polymarket-5m/ci/ladder.request]
  workflow_dispatch:

permissions: {}

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: read
      actions: write   # gh workflow run (the next recording)
    concurrency:
      group: polymarket-ladder-record
      cancel-in-progress: false
    outputs:
      enabled: ${{ steps.cfg.outputs.enabled }}
    defaults:
      run:
        working-directory: research/polymarket-5m
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/polymarket-5m/requirements.txt
      - run: pip install -r requirements.txt

      - name: Read ci/ladder.json
        id: cfg
        run: |
          python - >> "$GITHUB_OUTPUT" <<'PY'
          import datetime, json
          c = json.load(open("ci/ladder.json"))
          on = c.get("enabled", True) and datetime.date.today().isoformat() <= c.get("until", "2000-01-01")
          print(f"enabled={'true' if on else 'false'}")
          hours = float(c.get("hours", 5.5))
          print(f"hours={hours}")
          # a recorder that ran shorter than this crashed: the job fails after its data is uploaded
          # (last step), so the external monitor does not start the next run
          print(f"min_secs={int(min(1800, hours * 3600 / 2))}")
          PY

      - name: Discover the undelayed markets
        if: steps.cfg.outputs.enabled == 'true'
        timeout-minutes: 3
        run: |
          python ladder.py discover --days 1 --out "$RUNNER_TEMP/ladder/markets-start.json"
          python - "$RUNNER_TEMP/ladder/markets-start.json" <<'PY'
          import json, sys
          rows = json.load(open(sys.argv[1]))["markets"]
          assert rows, "no eligible market discovered"
          assert not any(m.get("itode") for m in rows), "delayed market passed discovery"
          print(f"eligible={len(rows)} tokens={2 * len(rows)}")
          PY

      - name: Record (market data only, no orders)
        id: rec
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          secs=$(python -c "print(int(float('${{ steps.cfg.outputs.hours }}') * 3600) + 300)")
          t0=$(date +%s)
          # SIGINT lets the recorder close its files; SIGKILL a minute later if it does not stop
          timeout -s INT -k 60 "$secs" python ladder.py record --out "$RUNNER_TEMP/ladder" \
            --hours ${{ steps.cfg.outputs.hours }} || true
          echo "secs=$(( $(date +%s) - t0 ))" >> "$GITHUB_OUTPUT"
          ls -la "$RUNNER_TEMP"/ladder/raw/*/ && du -sh "$RUNNER_TEMP/ladder/raw" && df -h "$RUNNER_TEMP" | tail -1
          zcat "$RUNNER_TEMP"/ladder/raw/*/errors.jsonl.gz 2>/dev/null | tail -n 5 || true

      - name: Build the tables
        if: steps.cfg.outputs.enabled == 'true'
        timeout-minutes: 10
        run: |
          python ladder.py build --src "$RUNNER_TEMP/ladder" --out "$RUNNER_TEMP/ladder/built"
          python - "$RUNNER_TEMP/ladder/built/counts.json" <<'PY'
          import json, sys
          c = json.load(open(sys.argv[1]))
          assert c["markets"] > 0 and c["books"] > 0 and c["binance"] > 0, c
          print(c)
          PY

      - name: Pack the recording
        if: always() && steps.cfg.outputs.enabled == 'true'   # keep the raw data even if build failed
        run: |
          cd "$RUNNER_TEMP/ladder"
          tar czf "$RUNNER_TEMP/ladder.tgz" built markets*.json raw/*/markets.jsonl* raw/*/errors.jsonl* \
            raw/*/binance.jsonl* 2>/dev/null || true
          tar czf "$RUNNER_TEMP/ladder-raw.tgz" raw/*/clob-*.jsonl* 2>/dev/null || true
          ls -la "$RUNNER_TEMP"/ladder*.tgz
      - uses: actions/upload-artifact@v4
        if: always() && steps.cfg.outputs.enabled == 'true'
        continue-on-error: true   # the raw upload below still runs
        with:
          name: ladder-${{ github.run_id }}
          path: ${{ runner.temp }}/ladder.tgz
          retention-days: 30
          overwrite: true          # a re-run of the job reuses the run id
          compression-level: 0     # already gzipped
      - uses: actions/upload-artifact@v4
        if: always() && steps.cfg.outputs.enabled == 'true'
        continue-on-error: true
        with:
          name: ladder-raw-${{ github.run_id }}
          path: ${{ runner.temp }}/ladder-raw.tgz
          retention-days: 30
          overwrite: true
          compression-level: 0

      - name: Fail a recorder that crashed (after the upload, so its data is kept)
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          if [ "${{ steps.rec.outputs.secs || 0 }}" -lt "${{ steps.cfg.outputs.min_secs }}" ]; then
            echo "the recorder ran ${{ steps.rec.outputs.secs || 0 }} s (< ${{ steps.cfg.outputs.min_secs }} s)"
            exit 1
          fi

  report:
    needs: record
    if: always() && needs.record.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write   # commit the report
      actions: read     # list the runs, download their artifacts
    concurrency:
      group: polymarket-ladder-report
      cancel-in-progress: false
    defaults:
      run:
        working-directory: research/polymarket-5m
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/polymarket-5m/requirements.txt
      - run: pip install -r requirements.txt

      - name: Build and check every ladder recording so far
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          rec="$RUNNER_TEMP/rec"; mkdir -p "$rec"
          ids=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?branch=${GITHUB_REF_NAME}&per_page=100" \
                --jq '.workflow_runs[] | select(.name == "polymarket-ladder") | .id')
          for id in $ids; do
            gh run download "$id" -n "ladder-$id" -D "$rec/$id" 2>/dev/null || continue
            tar xzf "$rec/$id/ladder.tgz" -C "$rec/$id" 2>/dev/null || true
            rm -f "$rec/$id/ladder.tgz"
            if [ ! -s "$rec/$id/built/counts.json" ]; then
              # the run's own build failed (it writes counts.json last): rebuild from its raw CLOB messages
              gh run download "$id" -n "ladder-raw-$id" -D "$rec/$id" 2>/dev/null \
                && tar xzf "$rec/$id/ladder-raw.tgz" -C "$rec/$id" 2>/dev/null || true
              rm -f "$rec/$id/ladder-raw.tgz"
              python ladder.py build --src "$rec/$id" --out "$rec/$id/built" || true
            fi
            rm -rf "$rec/$id/raw"
          done
          ls -d "$rec"/*/built 2>/dev/null | wc -l
          python ladder_check.py "$rec" --out real/ladder-check.md

      - name: Commit the report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -e real/ladder-check.md ] && git add real/ladder-check.md
          git diff --cached --quiet && exit 0
          git commit -q -m "research: ladder check after run $(date -u +%m-%d\ %H:%M) UTC" \
            -m "Workflow run ${{ github.run_id }}." \
            -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" \
            -m "Claude-Session: https://claude.ai/code/session_01PoRFRP2cwNX83uNbBzTS2M" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && exit 0; sleep $((2 ** i)); done
          exit 1
