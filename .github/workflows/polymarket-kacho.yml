name: polymarket-kacho

# Runs research/polymarket-5m/kacho.py on a GitHub runner, which can reach
# Hugging Face, Gamma and Binance, and commits the report to this branch.
# One run per change to ci/kacho.request; a line "mode: stage2" or "mode: stage3"
# there runs that pooled test instead of the BTC check. Nothing here trades or
# uses a key.
on:
  push:
    branches: [claude/polymarket-options-strategy-1lc7i4]
    paths: [research/polymarket-5m/ci/kacho.request]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: polymarket-kacho
  cancel-in-progress: false

jobs:
  kacho:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    defaults:
      run:
        working-directory: research/polymarket-5m
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/polymarket-5m/requirements.txt
      - run: pip install -r requirements.txt

      - name: Mode
        id: mode
        run: |
          mode=$(sed -n 's/^mode: *//p' ci/kacho.request | head -1)
          case "$mode" in
            stage2) echo "mode=stage2"; echo "coins=eth sol xrp doge" ;;
            stage3) echo "mode=stage3"; echo "coins=btc eth sol xrp doge" ;;
            diag101) echo "mode=diag101"; echo "coins=btc eth sol xrp doge" ;;
            survey) echo "mode=survey" ;;
            onchain) echo "mode=onchain"; echo "later=$(sed -n 's/^later: *//p' ci/kacho.request | head -1)" ;;
            *) echo "mode=btc" ;;
          esac >> "$GITHUB_OUTPUT"

      - name: Survey Hugging Face datasets
        if: steps.mode.outputs.mode == 'survey'
        run: |
          specs=()
          while IFS= read -r l; do specs+=(--inspect "$l"); done < <(sed -n 's/^inspect: *//p' ci/kacho.request)
          if [ ${#specs[@]} -gt 0 ]; then
            python hf_survey.py "${specs[@]}" --workdir "$RUNNER_TEMP" --out real/hf-inspect.md
          else
            python hf_survey.py --out real/hf-survey.md
          fi

      - name: Keep the filtered September fills between runs
        if: steps.mode.outputs.mode == 'onchain'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/onchain/fills
          key: onchain-fills-v1-${{ steps.mode.outputs.later }}
          restore-keys: onchain-fills-v1-

      - name: "On-chain: Gamma markets, Hugging Face fills, Binance, then the test"
        if: steps.mode.outputs.mode == 'onchain'
        run: |
          later="${{ steps.mode.outputs.later }}"
          python onchain.py fetch "$RUNNER_TEMP/onchain" --workdir "$RUNNER_TEMP" ${later:+--later "$later"}
          ls -la "$RUNNER_TEMP/onchain" "$RUNNER_TEMP/onchain/fills" && du -sh "$RUNNER_TEMP/onchain" && free -g
          python onchain.py run "$RUNNER_TEMP/onchain" --out real/onchain-sept.md --csv real/onchain-sept.csv
          if grep -q '^calibrate: *outcometick' ci/kacho.request; then
            # Exchange-stamped trade prints for 2026-09-08 (outcometick sample, CC BY 4.0) against that day's fills.
            mkdir -p "$RUNNER_TEMP/otick"
            curl -fsSL --retry 5 https://github.com/Ligengxin96/polymarket-data-samples/releases/latest/download/polymarket-data-samples.tar.gz \
              | tar xz -C "$RUNNER_TEMP/otick" --wildcards '*last_trade_price*'
            python onchain.py calibrate "$RUNNER_TEMP/onchain" --prints "$RUNNER_TEMP/otick" --out real/onchain-delay.md
          fi

      - name: "Stage ${{ steps.mode.outputs.mode }}: download, resolve and test"
        if: steps.mode.outputs.mode != 'btc' && steps.mode.outputs.mode != 'survey' && steps.mode.outputs.mode != 'onchain'
        run: |
          mkdir -p "$RUNNER_TEMP/kacho"
          for c in ${{ steps.mode.outputs.coins }}; do
            for k in markets ticks; do
              curl -fSL --retry 5 -o "$RUNNER_TEMP/kacho/${c}_$k.parquet" \
                "https://huggingface.co/datasets/kachoio/polymarket-5-minute-crypto-up-down-markets/resolve/main/${c}_$k.parquet" || true
            done
            python kacho.py fetch-outcomes "$RUNNER_TEMP/kacho" --coin "$c" || true
            python kacho.py fetch-binance "$RUNNER_TEMP/kacho" --coin "$c" || true
          done
          ls -la "$RUNNER_TEMP/kacho"
          python kacho.py ${{ steps.mode.outputs.mode }} "$RUNNER_TEMP/kacho" --out real/kacho-${{ steps.mode.outputs.mode }}.md

      - name: Download the kacho.io BTC files (CC0)
        if: steps.mode.outputs.mode == 'btc'
        run: |
          mkdir -p "$RUNNER_TEMP/kacho"
          for k in markets ticks; do
            curl -fSL --retry 5 -o "$RUNNER_TEMP/kacho/btc_$k.parquet" \
              "https://huggingface.co/datasets/kachoio/polymarket-5-minute-crypto-up-down-markets/resolve/main/btc_$k.parquet"
          done
          ls -la "$RUNNER_TEMP/kacho"
          python - "$RUNNER_TEMP/kacho" <<'PY'
          import sys, pyarrow.parquet as pq, pandas as pd
          for name in ("btc_markets", "btc_ticks"):
              f = pq.ParquetFile(f"{sys.argv[1]}/{name}.parquet")
              print(name, f.metadata.num_rows, "rows", f.schema_arrow)
          print(pd.read_parquet(f"{sys.argv[1]}/btc_markets.parquet").head(3).T)
          PY

      - name: Official outcomes from Gamma
        if: steps.mode.outputs.mode == 'btc'
        continue-on-error: true
        run: python kacho.py fetch-outcomes "$RUNNER_TEMP/kacho"

      - name: Binance 1s closes (price source for the momentum rules)
        if: steps.mode.outputs.mode == 'btc'
        continue-on-error: true
        run: python kacho.py fetch-binance "$RUNNER_TEMP/kacho"

      - name: Test the preregistered candidates
        if: steps.mode.outputs.mode == 'btc'
        run: python kacho.py run "$RUNNER_TEMP/kacho" --out real/kacho-btc.md

      - name: Commit the report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add real/kacho-* real/hf-*.md real/onchain-* 2>/dev/null || true
          git commit -q -m "research: kacho.io ${{ steps.mode.outputs.mode }} results" \
            -m "Workflow run ${{ github.run_id }}." \
            -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" \
            -m "Claude-Session: https://claude.ai/code/session_01PoRFRP2cwNX83uNbBzTS2M" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && exit 0; sleep $((2 ** i)); done
          exit 1
