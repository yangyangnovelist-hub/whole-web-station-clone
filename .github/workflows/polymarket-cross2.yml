name: polymarket-cross2

# Runs research/polymarket-5m/cross.py on a GitHub runner (Hugging Face is reachable there) and
# commits its report: a second lane beside polymarket-cross and polymarket-kacho. One run per
# change to research/polymarket-5m/ci/cross2.request, whose "cmd:" line is the cross.py command
# (e.g. "stale 10"). Nothing here trades or uses a key.
on:
  push:
    branches: [claude/polymarket-options-strategy-1lc7i4]
    paths: [research/polymarket-5m/ci/cross2.request]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: polymarket-cross2
  cancel-in-progress: false

jobs:
  cross:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    defaults:
      run:
        working-directory: research/polymarket-5m
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/polymarket-5m/requirements.txt
      - run: pip install -r requirements.txt
      - name: cross.py
        run: |
          python cross.py $(sed -n 's/^cmd: *//p' ci/cross2.request | head -1) --workdir "$RUNNER_TEMP/cross"
      - name: Commit the report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add real/cross-* 2>/dev/null || true
          git commit -q -m "research: cross.py $(sed -n 's/^cmd: *//p' ci/cross2.request | head -1) results" \
            -m "Workflow run ${{ github.run_id }}." \
            -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" \
            -m "Claude-Session: https://claude.ai/code/session_01PoRFRP2cwNX83uNbBzTS2M" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && exit 0; sleep $((2 ** i)); done
          exit 1
