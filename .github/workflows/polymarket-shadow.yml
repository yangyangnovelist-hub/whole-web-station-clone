name: polymarket-shadow

# After every forward recording run (polymarket-forward dispatches this): tests C and D on every
# recording so far, their reports committed to real/, and a status message to the WeChat Work
# group robot whose webhook is the repository secret WECOM_WEBHOOK (skipped while it is not
# set). Changing research/polymarket-5m/ci/shadow.request runs it by hand. Nothing here trades or
# uses a trading key.
on:
  push:
    branches: [claude/polymarket-options-strategy-1lc7i4]
    paths: [research/polymarket-5m/ci/shadow.request]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: polymarket-shadow
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: research/polymarket-5m
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/polymarket-5m/requirements.txt
      - run: pip install -r requirements.txt

      - name: Tests C and D on every recording so far
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          rec="$RUNNER_TEMP/rec"; mkdir -p "$rec"
          # every forward run, finished or not: the run that dispatched this one is still in its
          # last step, but its artifact is already uploaded
          ids=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/polymarket-forward.yml/runs?per_page=100" \
                --jq '.workflow_runs[].id')
          for id in $ids; do
            gh run download "$id" -n "recording-$id" -D "$rec/$id" 2>/dev/null || continue
            mkdir -p "$rec/$id/x"
            tar xzf "$rec/$id/raw.tgz" -C "$rec/$id/x" --wildcards 'bundle-*/latency' 2>/dev/null || continue
            # the CLOB disconnect log (latency.load_closes); recordings without one are just not checked
            tar xzf "$rec/$id/raw.tgz" -C "$rec/$id/x" --wildcards 'raw/*/errors.jsonl*' 2>/dev/null || true
            rm -f "$rec/$id/raw.tgz"
          done
          ls -d "$rec"/*/x/bundle-btc/latency 2>/dev/null | wc -l
          python latency.py "$rec" --pooled --out real/latency-test-c.md || true
          python latency.py "$rec" --test-d --out real/latency-test-d.md || true
          python latency.py "$rec" --test-f --out real/latency-test-f.md || true
          python latency.py "$rec" --diagnose-d --out real/latency-test-d-diagnose.md || true

      - name: Commit the reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add real/latency-test-* 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -q -m "research: tests C and D after run $(date -u +%m-%d\ %H:%M) UTC" \
            -m "Workflow run ${{ github.run_id }}." \
            -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" \
            -m "Claude-Session: https://claude.ai/code/session_01PoRFRP2cwNX83uNbBzTS2M" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && exit 0; sleep $((2 ** i)); done
          exit 1

      - name: Report to WeChat Work
        if: always()
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
        run: python notify.py
