name: polymarket-late-ms

# Late entry after a Binance jump on the GitHub forward books, beside a kacho-style per-second
# snapshot of the same books (late_ms.py; exploratory, market data only, no orders, no keys).
# Its own workflow so the shadow job keeps its time budget. Changing
# research/polymarket-5m/ci/late_ms.request runs it on every forward recording so far and commits
# real/late-ms.md, and rt_ms.py (round trips after a Binance jump at real latency) -> real/rt-ms.md.
on:
  push:
    branches: [claude/polymarket-options-strategy-1lc7i4]
    paths: [research/polymarket-5m/ci/late_ms.request]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: polymarket-late-ms
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: research/polymarket-5m
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/polymarket-5m/requirements.txt
      - run: pip install -r requirements.txt

      - name: Late entry on every forward recording so far
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          rec="$RUNNER_TEMP/rec"; mkdir -p "$rec"
          ids=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/polymarket-forward.yml/runs?per_page=100" \
                --jq '.workflow_runs[].id')
          for id in $ids; do
            gh run download "$id" -n "recording-$id" -D "$rec/$id" 2>/dev/null || continue
            mkdir -p "$rec/$id/x"
            tar xzf "$rec/$id/raw.tgz" -C "$rec/$id/x" --wildcards 'bundle-*/latency' 2>/dev/null || continue
            tar xzf "$rec/$id/raw.tgz" -C "$rec/$id/x" --wildcards 'raw/*/errors.jsonl*' 2>/dev/null || true
            rm -f "$rec/$id/raw.tgz"
          done
          ls -d "$rec"/*/x/bundle-btc/latency 2>/dev/null | wc -l
          python late_ms.py "$rec" --out real/late-ms.md || true
          python rt_ms.py "$rec" --out real/rt-ms.md || true

      - name: Commit the report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in real/late-ms.md real/rt-ms.md; do if [ -e "$f" ]; then git add "$f"; fi; done
          git diff --cached --quiet && exit 0
          git commit -q -m "research: late entry on the millisecond books, run $(date -u +%m-%d\ %H:%M) UTC" \
            -m "Workflow run ${{ github.run_id }}." \
            -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" \
            -m "Claude-Session: https://claude.ai/code/session_01PoRFRP2cwNX83uNbBzTS2M"
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && exit 0; sleep $((2 ** i)); done
          exit 1
