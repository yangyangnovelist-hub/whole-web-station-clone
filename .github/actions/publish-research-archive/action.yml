        compression-level: 0
        if-no-files-found: error
        retention-days: ${{ steps.prepare.outputs.retention-days }}

    - name: Upload independent part 00010
      id: part_10
      if: ${{ !cancelled() && steps.prepare.outcome == 'success' && fromJSON(steps.prepare.outputs.part-count) > 10 }}
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.prefix }}-part-00010
        path: ${{ inputs.parts-dir }}/part-00010.zip
        compression-level: 0
        if-no-files-found: error
