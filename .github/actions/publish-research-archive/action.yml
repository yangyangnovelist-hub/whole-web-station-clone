        path: ${{ inputs.parts-dir }}/part-00005.zip
        compression-level: 0
        if-no-files-found: error
        retention-days: ${{ steps.prepare.outputs.retention-days }}

    - name: Upload independent part 00006
      id: part_06
      if: ${{ !cancelled() && steps.prepare.outcome == 'success' && fromJSON(steps.prepare.outputs.part-count) > 6 }}
