name: Publish bounded research archive
description: Publish one separate Actions artifact per 400 MiB transport part, then a verified small index
inputs:
  archive:
    description: Sealed archive file (not a directory or symlink)
    required: true
  prefix:
    description: Unique artifact prefix for this run and archive type
    required: true
  parts-dir:
    description: New staging directory; must not already exist
    required: true
  retention-days:
    description: Retention for all parts and the completion index
    required: false
    default: '30'
  part-mib:
    description: Payload MiB per part (1 through 400; small values for CI fixtures)
    required: false
    default: '400'
outputs:
  manifest-sha256:
    description: Trusted manifest hash from the producer job
    value: ${{ steps.prepare.outputs.manifest-sha256 }}
  source-sha256:
    description: Original sealed archive SHA256
    value: ${{ steps.prepare.outputs.source-sha256 }}
  part-count:
    description: Number of separately uploaded parts
    value: ${{ steps.prepare.outputs.part-count }}
  artifact-id:
    description: Small completion index artifact ID; absent on incomplete publishing
    value: ${{ steps.index.outputs.artifact-id }}
runs:
  using: composite
  steps:
    - name: Split sealed archive within connector limits
      id: prepare
      shell: bash
      env:
        TRANSPORT_HELPER: ${{ github.action_path }}/../../../research/polymarket-5m/publish_archive.py
        ARCHIVE_PATH: ${{ inputs.archive }}
        ARTIFACT_PREFIX: ${{ inputs.prefix }}
        PARTS_DIR: ${{ inputs.parts-dir }}
        RETENTION_DAYS: ${{ inputs.retention-days }}
        PART_MIB: ${{ inputs.part-mib }}
      run: python "$TRANSPORT_HELPER" prepare

    - name: Upload independent part 00000
      id: part_00
      if: ${{ !cancelled() && steps.prepare.outcome == 'success' && fromJSON(steps.prepare.outputs.part-count) > 0 }}
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.prefix }}-part-00000
        path: ${{ inputs.parts-dir }}/part-00000.zip
        compression-level: 0
        if-no-files-found: error
        retention-days: ${{ steps.prepare.outputs.retention-days }}

    - name: Upload independent part 00001
      id: part_01
      if: ${{ !cancelled() && steps.prepare.outcome == 'success' && fromJSON(steps.prepare.outputs.part-count) > 1 }}
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.prefix }}-part-00001
        path: ${{ inputs.parts-dir }}/part-00001.zip
        compression-level: 0
        if-no-files-found: error
        retention-days: ${{ steps.prepare.outputs.retention-days }}

    - name: Upload independent part 00002
      id: part_02
      if: ${{ !cancelled() && steps.prepare.outcome == 'success' && fromJSON(steps.prepare.outputs.part-count) > 2 }}
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.prefix }}-part-00002
        path: ${{ inputs.parts-dir }}/part-00002.zip
        compression-level: 0
        if-no-files-found: error
        retention-days: ${{ steps.prepare.outputs.retention-days }}

    - name: Upload independent part 00003
      id: part_03
      if: ${{ !cancelled() && steps.prepare.outcome == 'success' && fromJSON(steps.prepare.outputs.part-count) > 3 }}
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.prefix }}-part-00003
        path: ${{ inputs.parts-dir }}/part-00003.zip
        compression-level: 0
        if-no-files-found: error
        retention-days: ${{ steps.prepare.outputs.retention-days }}

    - name: Upload independent part 00004
      id: part_04
      if: ${{ !cancelled() && steps.prepare.outcome == 'success' && fromJSON(steps.prepare.outputs.part-count) > 4 }}
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.prefix }}-part-00004
        path: ${{ inputs.parts-dir }}/part-00004.zip
        compression-level: 0
        if-no-files-found: error
        retention-days: ${{ steps.prepare.outputs.retention-days }}

    - name: Upload independent part 00005
      id: part_05
      if: ${{ !cancelled() && steps.prepare.outcome == 'success' && fromJSON(steps.prepare.outputs.part-count) > 5 }}
