        retention-days: ${{ steps.prepare.outputs.retention-days }}

    - name: Require all expected part uploads before publishing index
      id: complete
      if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
      shell: bash
      env:
        TRANSPORT_HELPER: ${{ github.action_path }}/../../../research/polymarket-5m/publish_archive.py
        PARTS_DIR: ${{ inputs.parts-dir }}
        ARTIFACT_PREFIX: ${{ inputs.prefix }}
        EXPECTED_MANIFEST_SHA256: ${{ steps.prepare.outputs.manifest-sha256 }}
        UPLOAD_STEP_RESULTS: ${{ toJSON(steps) }}
      run: python "$TRANSPORT_HELPER" complete

    - name: Publish small completion index
      id: index
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.prefix }}-index
        path: |
          ${{ inputs.parts-dir }}/manifest.json
          ${{ inputs.parts-dir }}/manifest.sha256
          ${{ inputs.parts-dir }}/publish-index.json
        compression-level: 0
        if-no-files-found: error
        retention-days: ${{ steps.prepare.outputs.retention-days }}
