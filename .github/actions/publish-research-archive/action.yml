    - name: Upload independent part 00011
      id: part_11
      if: ${{ !cancelled() && steps.prepare.outcome == 'success' && fromJSON(steps.prepare.outputs.part-count) > 11 }}
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.prefix }}-part-00011
        path: ${{ inputs.parts-dir }}/part-00011.zip
